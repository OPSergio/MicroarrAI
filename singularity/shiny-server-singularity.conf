# =============================================================================
# Shiny Server Configuration - Singularity/Apptainer Edition
# =============================================================================
# Variante del shiny-server.conf adaptada para ejecución en Singularity.
#
# DIFERENCIA CLAVE respecto a shiny-server.conf (Docker):
#   - Se elimina la directiva "run_as shiny;" porque Singularity ejecuta el
#     proceso como el usuario actual del sistema host, sin capacidad de hacer
#     setuid a otro usuario salvo que se use --fakeroot o root.
#   - Sin "run_as", Shiny Server hereda el usuario que inicia la instancia.
#
# Este fichero se copia automáticamente dentro de la imagen .sif durante el
# build (MicroarrAI.def) y reemplaza el shiny-server.conf por defecto.
# =============================================================================

server {
  # Puerto de escucha (equivalente al EXPOSE 3838 del Dockerfile)
  listen 3838;

  # Ruta principal: /MicroarrAI
  location /MicroarrAI {
    site_dir /srv/shiny-server/MicroarrAI;
    log_dir  /var/log/shiny-server;

    # Sin indexación de directorio en producción
    directory_index off;

    # Timeouts (iguales a docker-compose: init 60s, idle 3600s)
    app_init_timeout 60;
    app_idle_timeout 3600;

    # Reconexión automática
    reconnect true;
  }

  # Ruta raíz: redirige también a la aplicación
  location / {
    site_dir /srv/shiny-server/MicroarrAI;
    log_dir  /var/log/shiny-server;
    app_init_timeout 60;
    app_idle_timeout 3600;
    directory_index on;
  }
}

# =============================================================================
# NOTAS
# =============================================================================
# - Los logs se escriben en /var/log/shiny-server/
#   Montar con: --bind ./logs:/var/log/shiny-server
#
# - Para datos persistentes de usuario montar con:
#   --bind ./data:/srv/shiny-server/MicroarrAI/data
#
# - Si se ejecuta con root o --fakeroot, se puede añadir de nuevo:
#   run_as shiny;
# =============================================================================
