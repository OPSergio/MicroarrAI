# =============================================================================
# Shiny Server Configuration - Singularity/Apptainer
# =============================================================================
# Variant of shiny-server.conf adapted for Singularity execution.
#
# KEY DIFFERENCE from shiny-server.conf (Docker):
#   - The "run_as shiny;" directive is omitted because Singularity runs
#     processes as the invoking host user, without the ability to setuid
#     to another user unless --fakeroot or root is used.
#   - Without "run_as", Shiny Server inherits the user that starts the instance.
#
# This file is automatically copied into the .sif image during the build
# (MicroarrAI.def) and replaces the default shiny-server.conf.
# =============================================================================

# Keep every R process log, also those of processes that exited cleanly:
# a crash is only understandable next to what the process logged before it.
# The admin panel shows them (Logs tab) and its Maintenance step purges old ones.
preserve_logs true;
access_log /var/log/shiny-server/access.log default;

server {
  # Listening port (equivalent to EXPOSE 3838 in the Dockerfile)
  listen 3838;

  # Admin panel. Must come BEFORE /MicroarrAI: the first matching location
  # wins, and /MicroarrAI would otherwise swallow /MicroarrAI/admin.
  # /admin covers a proxy that strips the /MicroarrAI prefix.
  location /MicroarrAI/admin {
    site_dir /srv/shiny-server/MicroarrAI/admin;
    log_dir  /var/log/shiny-server;
    directory_index off;
    app_init_timeout 60;
    app_idle_timeout 300;
    reconnect true;
  }
  location /admin {
    site_dir /srv/shiny-server/MicroarrAI/admin;
    log_dir  /var/log/shiny-server;
    directory_index off;
    app_init_timeout 60;
    app_idle_timeout 300;
    reconnect true;
  }

  # Main path: /MicroarrAI
  location /MicroarrAI {
    site_dir /srv/shiny-server/MicroarrAI;
    log_dir  /var/log/shiny-server;

    # No directory indexing in production
    directory_index off;

    # Timeouts (same as docker-compose: init 60s, idle 3600s)
    app_init_timeout 300;
    app_idle_timeout 3600;

    # Automatic reconnection
    reconnect true;
  }

  # Root path: also serves the application
  location / {
    site_dir /srv/shiny-server/MicroarrAI;
    log_dir  /var/log/shiny-server;
    app_init_timeout 300;
    app_idle_timeout 3600;
    directory_index off;
  }
}

# =============================================================================
# NOTES
# =============================================================================
# - Logs are written to /var/log/shiny-server/
#   Mount with: --bind ./logs:/var/log/shiny-server
#
# - For persistent user data, mount with:
#   --bind ./data:/srv/shiny-server/MicroarrAI/data
#
# - If running as root or with --fakeroot, you can add back:
#   run_as shiny;
# =============================================================================
