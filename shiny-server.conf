# =============================================================================
# Shiny Server Configuration
# =============================================================================
# Custom configuration for MicroarrAI deployment
# This file will be used in the Docker container if uncommented in Dockerfile
# =============================================================================

# Run Shiny Server as the 'shiny' user
run_as shiny;

# Define server behavior
server {
  # Listen on port 3838
  listen 3838;

  # Define location for the MicroarrAI app
  location /MicroarrAI {
    # Directory where app is hosted
    site_dir /srv/shiny-server/MicroarrAI;
    
    # Log directory
    log_dir /var/log/shiny-server;
    
    # Directory indexing (set to false for production)
    directory_index off;
    
    # Application timeout settings
    app_init_timeout 60;
    app_idle_timeout 3600;
    
    # Session settings
    reconnect true;
    
    # Bookmarking (enable if needed)
    # bookmark_state_dir /var/lib/shiny-server/bookmarks;
  }
  
  # Optional: Serve app at root path as well
  location / {
    site_dir /srv/shiny-server/MicroarrAI;
    log_dir /var/log/shiny-server;
    directory_index on;
  }
}

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
# Adjust these values based on server resources

# Number of worker processes
# preserve_logs true;

# Connection limit per app
# simple_scheduler 15;

# =============================================================================
# LOGGING
# =============================================================================
# Access and error logs are stored in /var/log/shiny-server/
# You can mount this directory as a volume for persistent logs:
#   docker run -v /path/to/logs:/var/log/shiny-server microarrai:latest
# =============================================================================
