version: '3.8'

# =============================================================================
# MicroarrAI - Docker Compose Configuration
# =============================================================================
# Simplified deployment for MicroarrAI Shiny application
# =============================================================================

services:
  microarrai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    
    image: microarrai:latest
    
    container_name: microarrai-app
    
    # Port mapping: host:container.
    # Values come from docker/.env (copy docker/.env.example); the defaults after
    # ":-" apply when that file is absent, so this works with no configuration.
    ports:
      - "${SHINY_PORT:-3838}:3838"

    environment:
      - SHINY_LOG_LEVEL=${SHINY_LOG_LEVEL:-INFO}
      # Ceiling for one RAW upload, i.e. a whole scan set at once (see R/global.R)
      - MICROARRAI_MAX_UPLOAD_MB=${MICROARRAI_MAX_UPLOAD_MB:-1024}
    
    # Volumes for persistent data and logs
    volumes:
      # No data volume on purpose: users upload their scans through the browser
      # and the files live in the session tempdir, not on the host.

      # Persist logs
      - ../logs:/var/log/shiny-server
      
      # Optional: Mount custom config
      # - ./shiny-server.conf:/etc/shiny-server/shiny-server.conf:ro
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (adjust based on server capacity)
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-4}'
          memory: ${MEMORY_LIMIT:-8G}
        reservations:
          cpus: '${CPU_RESERVATION:-2}'
          memory: ${MEMORY_RESERVATION:-4G}
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/MicroarrAI"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# =============================================================================
# USAGE
# =============================================================================
# Start the application:
#   docker-compose up -d
#
# Stop the application:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f
#
# Rebuild and restart:
#   docker-compose up -d --build
#
# Access the app:
#   http://your-server-ip:3838/MicroarrAI
# =============================================================================
